<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Reference Hover State</title>
  <style>
    :root {
      --paper: #f2eee3;
      --ink: #161c15;
      --muted: #78816b;
      --line: #677252;
      --acid: #b9ff62;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 15%, rgba(185, 255, 98, 0.14), transparent 32%),
        radial-gradient(circle at 85% 85%, rgba(75, 94, 52, 0.16), transparent 40%),
        var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", "Avenir Next", sans-serif;
    }

    .capture {
      width: 560px;
      padding: 34px;
      border: 1px solid rgba(80, 91, 67, 0.22);
      border-radius: 28px;
      background: rgba(249, 246, 237, 0.78);
      box-shadow: 0 30px 80px rgba(47, 58, 36, 0.14);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px 4px;
      color: var(--muted);
      font-family: "Courier New", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--acid);
      box-shadow: 0 0 12px rgba(185, 255, 98, 0.9);
      content: "";
    }

    .select-shell {
      position: relative;
      isolation: isolate;
    }

    select {
      width: 100%;
      height: 78px;
      appearance: none;
      border: 2px solid var(--line);
      border-radius: 20px;
      outline: none;
      padding: 0 82px 0 30px;
      background:
        linear-gradient(112deg, #141a14 0%, #1b2518 58%, #20291b 100%);
      color: #f8f4e9;
      font: 600 21px/1 "Trebuchet MS", "Avenir Next", sans-serif;
      letter-spacing: -0.02em;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -18px 28px rgba(0, 0, 0, 0.15),
        0 18px 34px rgba(27, 35, 23, 0.2);
      cursor: pointer;
      transition:
        transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
        border-color 220ms ease,
        box-shadow 220ms ease,
        background-color 220ms ease;
    }

    .select-shell::before {
      position: absolute;
      z-index: 2;
      top: 23px;
      bottom: 23px;
      left: 13px;
      width: 4px;
      border-radius: 999px;
      background: var(--acid);
      box-shadow: 0 0 18px rgba(185, 255, 98, 0.85);
      opacity: 0;
      transform: scaleY(0.45);
      transition: opacity 180ms ease, transform 220ms ease;
      content: "";
      pointer-events: none;
    }

    .chevron {
      position: absolute;
      z-index: 3;
      top: 17px;
      right: 18px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(242, 238, 227, 0.22);
      border-radius: 50%;
      background: rgba(244, 240, 230, 0.08);
      color: #d9e0ce;
      font-size: 18px;
      line-height: 1;
      transition:
        transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
        background-color 220ms ease,
        color 220ms ease;
      pointer-events: none;
    }

    .select-shell:hover select,
    select:focus-visible {
      border-color: var(--acid);
      background:
        linear-gradient(112deg, #172016 0%, #24311d 58%, #2a3820 100%);
      box-shadow:
        0 0 0 1px rgba(185, 255, 98, 0.92),
        0 0 34px rgba(185, 255, 98, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 -18px 28px rgba(0, 0, 0, 0.18),
        0 24px 42px rgba(27, 35, 23, 0.24);
      transform: translateY(-3px);
    }

    .select-shell:hover::before,
    .select-shell:focus-within::before {
      opacity: 1;
      transform: scaleY(1);
    }

    .select-shell:hover .chevron,
    .select-shell:focus-within .chevron {
      background: var(--acid);
      color: var(--ink);
      transform: rotate(180deg);
    }
  </style>
</head>
<body>
  <div class="capture">
    <div class="eyebrow">Workspace mode</div>
    <div class="select-shell">
      <select id="tier" aria-label="Workspace mode">
        <option>Automatic</option>
        <option>Focus</option>
        <option>Deep work</option>
      </select>
      <span class="chevron" aria-hidden="true">⌄</span>
    </div>
  </div>
</body>
</html>
